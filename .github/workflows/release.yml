name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION=$(sed -n 's/^version: "\([0-9][0-9.]*\)"$/\1/p' icad2mqtt/config.yaml)
          if [ -z "$VERSION" ] || [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "release tag $RELEASE_TAG does not match add-on version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build amd64 image for scan
        run: docker build --pull --platform linux/amd64 --tag icad2mqtt:release-amd64 .
      - name: Scan amd64 image before publishing
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: icad2mqtt:release-amd64
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
      - name: Log in to GHCR
        shell: bash
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish multi-architecture image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/justbeanie/icad2mqtt:$VERSION" \
            --tag ghcr.io/justbeanie/icad2mqtt:latest \
            --provenance=true \
            --sbom=true \
            --push .
