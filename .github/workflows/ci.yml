name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
      go-version: '1.24'
    
    - name: Download dependencies
      run: go mod download
    
    - name: Verify dependencies
      run: go mod verify
    
    - name: Format check
      shell: bash
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -trimpath -v ./...
    
    - name: Test with race detector
      run: go test -race -coverprofile=coverage.out -covermode=atomic -v ./...

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-file: go.mod
        go-package: ./...

  addon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: icad2mqtt
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: icad2mqtt/go.mod
        cache: true
    - name: Download add-on dependencies
      run: go mod download
    - name: Verify add-on dependencies
      run: go mod verify
    - name: Check add-on formatting
      run: test -z "$(gofmt -l .)"
    - name: Vet add-on
      run: go vet ./...
    - name: Test add-on
      run: go test ./...
    - name: Build add-on binary
      run: go build -trimpath ./...

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, vulnerability-scan, addon]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build --pull --tag icad2mqtt:test .
    
    - name: Test Docker image
      run: docker run --rm --read-only --cap-drop=ALL icad2mqtt:test --help

    - name: Scan Docker image
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: icad2mqtt:test
        format: table
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: os,library
